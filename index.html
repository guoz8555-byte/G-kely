<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="映界——支持上传、点赞与 VIP 试看的视频内容站" />
  <title>映界 · VIP 视频</title>
  <style>
    :root{--bg:#08090b;--panel:#111318;--soft:#191c22;--line:#272a31;--text:#f4f2ee;--muted:#9699a1;--gold:#e9b949;--gold2:#fff0aa;--red:#ff4d5d}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% -10%,#302611 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}
    header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:20;background:rgba(8,9,11,.84);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.14em}.mark{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 140deg,var(--gold),#6e4910,var(--gold2),var(--gold));display:grid;place-items:center;color:#141008;font-size:13px;box-shadow:0 0 28px #e9b94944}
    nav{display:flex;gap:26px;color:#b8bac0;font-size:14px}nav a{color:inherit;text-decoration:none}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#16181d;color:#fff;border-radius:999px;padding:11px 18px}.btn.gold{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a06;font-weight:800}.btn:hover{transform:translateY(-1px)}
    main{max-width:1500px;margin:auto;padding:48px 5vw 80px}.hero{min-height:410px;border:1px solid #282116;border-radius:30px;padding:58px;display:flex;align-items:end;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(6,7,9,.97) 5%,rgba(6,7,9,.72) 48%,rgba(6,7,9,.14)),linear-gradient(135deg,#211c12,#05070b 70%)}
    .hero:after{content:"";position:absolute;right:7%;top:13%;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffeab0,#c99325 9%,#19150d 28%,#020305 68%);box-shadow:0 0 100px #d99e2633}.hero-copy{max-width:650px;position:relative;z-index:2}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.24em;font-size:12px;font-weight:800}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(42px,6vw,78px);line-height:.98;margin:18px 0}.hero p{color:#b7b7b5;line-height:1.8;max-width:560px}.hero-cta{display:flex;gap:12px;margin-top:28px}
    .toolbar{display:flex;justify-content:space-between;align-items:end;margin:48px 0 22px}.toolbar h2{font-size:28px;margin:0 0 8px}.toolbar p{color:var(--muted);margin:0}.tabs{display:flex;gap:7px}.tab{background:transparent;border:1px solid var(--line);color:#a9abb1;padding:9px 15px;border-radius:999px}.tab.active{background:#f1eee7;color:#121317;border-color:#f1eee7}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:var(--panel);border:1px solid #202329;border-radius:20px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#514526}.thumb{aspect-ratio:16/10;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--image)}.thumb:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 55%)}.play{width:58px;height:58px;border:1px solid #ffffff77;border-radius:50%;display:grid;place-items:center;background:#0008;backdrop-filter:blur(7px);position:relative;color:#fff;font-size:20px;padding-left:4px}.badge{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:999px;background:#090a0dcc;font-size:11px;font-weight:800;letter-spacing:.1em}.badge.vip{color:#241b07;background:linear-gradient(135deg,var(--gold2),var(--gold))}.duration{position:absolute;right:13px;bottom:12px;background:#050609cc;padding:5px 8px;border-radius:7px;font-size:12px}.body{padding:18px}.body h3{font-size:18px;margin:0 0 9px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.like{border:0;background:transparent;color:#bbb;padding:0}.like.liked{color:var(--red)}
    .upload-panel{display:none;position:fixed;inset:0;background:#000b;z-index:30;place-items:center;padding:20px}.upload-panel.open{display:grid}.dialog{width:min(560px,100%);background:#121419;border:1px solid #30333a;border-radius:24px;padding:28px;box-shadow:0 30px 100px #000}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0}.close{background:none;border:0;color:#aaa;font-size:24px}.drop{border:1px dashed #5a5d64;border-radius:18px;padding:42px;text-align:center;margin:24px 0;background:#0c0e12}.drop input{width:100%;margin-top:16px;color:#999}.field{display:grid;gap:8px;margin:14px 0}.field input{background:#090b0e;border:1px solid #30333a;color:#fff;border-radius:12px;padding:13px}.switch{display:flex;justify-content:space-between;align-items:center;color:#ccc}.switch input{accent-color:var(--gold);width:20px;height:20px}
    .player-modal{display:none;position:fixed;inset:0;background:#000e;z-index:40;place-items:center;padding:20px}.player-modal.open{display:grid}.player-wrap{width:min(980px,96vw);position:relative}.player-wrap video{width:100%;max-height:78vh;background:#000;border-radius:18px}.player-title{display:flex;justify-content:space-between;margin-top:14px;align-items:center}.paywall{display:none;position:absolute;inset:0;background:radial-gradient(circle at center,#2b2417cc,#050609f5 66%);border-radius:18px;place-items:center;text-align:center;padding:20px}.paywall.open{display:grid}.lock{font-size:38px}.paywall h2{font-family:Georgia,"Songti SC",serif;font-size:34px;margin:12px}.paywall p{color:#b7b7b7}.note{text-align:center;color:#777;font-size:12px;margin-top:42px}
    @media(max-width:900px){nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:38px;min-height:370px}.hero:after{opacity:.55;right:-18%}.hero h1{font-size:50px}}@media(max-width:620px){header{padding:0 20px}.brand span:last-child{display:none}.actions .btn:first-child{display:none}main{padding:28px 18px 60px}.hero{padding:28px;border-radius:22px}.hero h1{font-size:42px}.hero-cta{flex-direction:column}.toolbar{align-items:flex-start;gap:18px;flex-direction:column}.grid{grid-template-columns:1fr}.tabs{overflow:auto;width:100%}}
  </style>
</head>
<body>
  <header><div class="brand"><span class="mark">15″</span><span>映界 CINEMA</span></div><nav><a href="#discover">发现</a><a href="#vip">VIP 专区</a><a href="#creator">创作者</a></nav><div class="actions"><button class="btn">登录</button><button class="btn gold" id="openUpload">＋ 上传作品</button></div></header>
  <main>
    <section class="hero"><div class="hero-copy"><div class="eyebrow">映界独家 · 本周首映</div><h1>好故事，值得<br>被完整看见。</h1><p>发现独立影像与精选创作。普通内容免费观看，VIP 作品开放 15 秒预览，一次付费即可解锁完整影片。</p><div class="hero-cta"><button class="btn gold" onclick="document.querySelector('.card').scrollIntoView()">▶ 开始探索</button><button class="btn" id="heroUpload">上传我的视频</button></div></div></section>
    <section id="discover"><div class="toolbar"><div><h2>正在热映</h2><p>编辑精选，持续更新</p></div><div class="tabs"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="free">免费</button><button class="tab" data-filter="vip">VIP</button></div></div><div class="grid" id="grid"></div></section>
    <p class="note">演示站 · 上传视频仅保存在当前浏览器会话，支付按钮为可配置跳转链接</p>
  </main>
  <div class="upload-panel" id="uploadPanel"><form class="dialog" id="uploadForm"><div class="dialog-head"><h2>发布新作品</h2><button type="button" class="close" data-close="upload">×</button></div><div class="drop"><strong>选择一个视频文件</strong><div style="color:#777;margin-top:8px;font-size:13px">支持 MP4、WebM、MOV</div><input id="videoFile" type="file" accept="video/*" required></div><label class="field">作品标题<input id="videoTitle" required placeholder="给你的作品起个名字"></label><label class="switch"><span>设为 VIP 内容（试看 15 秒）</span><input id="isVip" type="checkbox" checked></label><button class="btn gold" style="width:100%;margin-top:22px" type="submit">发布作品</button></form></div>
  <div class="player-modal" id="playerModal"><div class="player-wrap"><video id="player" controls playsinline></video><div class="paywall" id="paywall"><div><div class="lock">◈</div><div class="eyebrow">15 秒试看已结束</div><h2>解锁完整影片</h2><p>购买后即可继续观看，并永久收藏本片。</p><button class="btn gold" id="payButton">立即解锁 · ¥ 9.9</button></div></div><div class="player-title"><strong id="nowTitle"></strong><button class="btn" data-close="player">关闭</button></div></div></div>
  <script>
    const paymentUrl='https://example.com/pay';
    const samples=[
      {title:'潮汐以北',vip:true,likes:2841,duration:'18:42',color:'linear-gradient(135deg,#23424b,#0b161b 48%,#bf8148)'},
      {title:'午夜列车',vip:true,likes:1926,duration:'26:15',color:'linear-gradient(135deg,#402229,#090a10 50%,#355172)'},
      {title:'风经过旧屋',vip:false,likes:864,duration:'08:21',color:'linear-gradient(135deg,#a28c6e,#35352d 50%,#182027)'},
      {title:'无声的蓝',vip:false,likes:1255,duration:'12:08',color:'linear-gradient(135deg,#172b4a,#31648a 50%,#b6a97f)'},
      {title:'候鸟来信',vip:true,likes:3076,duration:'32:40',color:'linear-gradient(135deg,#795039,#171a1e 54%,#314a46)'},
      {title:'雨天留声机',vip:false,likes:743,duration:'06:19',color:'linear-gradient(135deg,#41464d,#181b21 55%,#8f6b45)'}
    ];
    const grid=document.getElementById('grid'), player=document.getElementById('player'), paywall=document.getElementById('paywall'); let currentVip=false;
    function render(filter='all'){grid.innerHTML='';samples.filter(x=>filter==='all'||(filter==='vip')===x.vip).forEach((v,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="thumb" style="--image:${v.color}"><span class="badge ${v.vip?'vip':''}">${v.vip?'VIP · 试看 15 秒':'免费观看'}</span><button class="play" aria-label="播放 ${v.title}">▶</button><span class="duration">${v.duration}</span></div><div class="body"><h3>${v.title}</h3><div class="meta"><span>映界精选 · ${v.vip?'会员':'公开'}</span><button class="like" aria-label="点赞">♡ <span>${v.likes}</span></button></div></div>`;el.querySelector('.play').onclick=()=>openPlayer(v);el.querySelector('.like').onclick=e=>{const b=e.currentTarget,n=b.querySelector('span');b.classList.toggle('liked');n.textContent=+n.textContent+(b.classList.contains('liked')?1:-1);b.childNodes[0].textContent=b.classList.contains('liked')?'♥ ':'♡ '};grid.appendChild(el)})}
    function openPlayer(v){currentVip=v.vip;document.getElementById('nowTitle').textContent=v.title;paywall.classList.remove('open');player.src=v.src||'';document.getElementById('playerModal').classList.add('open');if(!v.src){player.poster='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="100%" height="100%" fill="#11151b"/><text x="50%" y="50%" fill="#ddd" font-size="38" text-anchor="middle" font-family="sans-serif">${v.title} · 演示影片</text></svg>`)} }
    player.addEventListener('timeupdate',()=>{if(currentVip&&player.currentTime>=15&&!paywall.classList.contains('open')){player.pause();paywall.classList.add('open')}});
    document.getElementById('payButton').onclick=()=>window.open(paymentUrl,'_blank','noopener');
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(b.dataset.close==='upload')document.getElementById('uploadPanel').classList.remove('open');else{player.pause();document.getElementById('playerModal').classList.remove('open')}});
    const showUpload=()=>document.getElementById('uploadPanel').classList.add('open');document.getElementById('openUpload').onclick=showUpload;document.getElementById('heroUpload').onclick=showUpload;
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');render(t.dataset.filter)});
    document.getElementById('uploadForm').onsubmit=e=>{e.preventDefault();const f=document.getElementById('videoFile').files[0];samples.unshift({title:document.getElementById('videoTitle').value,vip:document.getElementById('isVip').checked,likes:0,duration:'新上传',src:URL.createObjectURL(f),color:'linear-gradient(135deg,#715321,#17191e,#40334f)'});document.getElementById('uploadPanel').classList.remove('open');e.target.reset();render();window.scrollTo({top:480,behavior:'smooth'})};
    render();
  </script>
</body>
</html>
